<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e8ecf1;
    position: relative;
  }
  
  .bg-layer {
    position: absolute;
    inset: -30px;
    background: url('file:///tmp/user_video_frames/frame_047.jpg') center/cover no-repeat;
    filter: blur(32px) saturate(140%) brightness(1.08);
    transform: scale(1.08);
  }
  
  .bg-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(241, 244, 248, 0.84) 0%, rgba(225, 230, 237, 0.94) 100%);
  }
  
  .outro-card {
    position: relative;
    z-index: 10;
    width: 860px;
    background: rgba(255, 255, 255, 0.94);
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    border-radius: 32px;
    padding: 48px 56px 44px;
    box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(148, 163, 184, 0.15);
    backdrop-filter: blur(24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  
  .icon-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 28px -4px rgba(16, 185, 129, 0.45);
    margin-bottom: 22px;
  }
  
  .icon-circle svg {
    width: 46px;
    height: 46px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .title {
    font-size: 40px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    line-height: 1.15;
  }
  
  .subtitle {
    font-size: 18px;
    font-weight: 500;
    color: #475569;
    max-width: 620px;
    line-height: 1.5;
    margin-bottom: 30px;
  }
  
  .link-box {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #0f172a;
    border: 2px solid #0077ff;
    padding: 16px 32px;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0, 119, 255, 0.25);
    margin-bottom: 24px;
  }
  
  .link-icon-circle {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #0077ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .link-icon-circle svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .link-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  
  .footer-note {
    font-size: 14px;
    font-weight: 600;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>
  
  <div class="outro-card">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    
    <h1 class="title">Спасибо за внимание!</h1>
    <p class="subtitle">Используйте все возможности автоматизированного мониторинга и отчётности уже сегодня</p>
    
    <div class="link-box">
      <div class="link-icon-circle">
        <svg viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <span class="link-text">https://biblioteka33.ru/stat</span>
    </div>
    
    <div class="footer-note">Центральная городская библиотека г. Владимира · 2026</div>
  </div>
</body>
</html>
